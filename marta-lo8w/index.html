<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Porciona</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Porciona">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#214D31">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icono-192.png">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Mrs+Saint+Delafield&display=swap">
<style>
/* Layout: app de una columna para celular, pestañas fijas abajo; el plan llega en un código que pega la paciente */
:root{
  --bg:#F3EEF1; --card:#FBF9FA; --ink:#1F2B23; --muted:#5F6B62; --line:#E0D5DA;
  --bosque:#214D31; --rosa:#EA9CAF; --orquidea:#D56989; --lima:#C2DC80; --salvia:#93B25A; --malva:#E4D6DD;
  --title:#214D31; --tab:#FBF9FA; --field:#FFFFFF;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Instrument Sans','Helvetica Neue',Arial,sans-serif; --firma:'Mrs Saint Delafield',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141C17; --card:#1D2721; --ink:#EDE6EA; --muted:#A8B3AB; --line:#2F3B33;
  --title:#C2DC80; --tab:#1D2721; --malva:#5A4A52; --field:#141C17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141C17; --card:#1D2721; --ink:#EDE6EA; --muted:#A8B3AB; --line:#2F3B33;
  --title:#C2DC80; --tab:#1D2721; --malva:#5A4A52; --field:#141C17; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.firma{font-family:var(--firma);font-size:30px;color:var(--title);line-height:.9}
.marca{font-family:var(--serif);font-size:34px;color:var(--title);line-height:.9}
.marca em{color:var(--orquidea)}
.rol{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--title);font-weight:600}
.hola{font-family:var(--serif);font-size:20px;color:var(--orquidea);white-space:nowrap}
h1{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1;margin:0;color:var(--title);text-wrap:balance}
h1 em,h2 em{color:var(--orquidea)}
h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0;color:var(--title);line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.col{display:flex;flex-direction:column;gap:18px}
/* fecha */
.dia{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dia button{background:var(--card);border:1px solid var(--line);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer}
.dia button:disabled{opacity:.3;cursor:default}
.dia .f{text-align:center}
.dia .f b{display:block;font-family:var(--serif);font-weight:400;font-size:22px;color:var(--title)}
/* resumen */
.resumen{background:#214D31;color:#fff;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.anillo{width:74px;height:74px;flex:none}
.anillo text{font-family:var(--serif);font-size:22px;fill:#fff}
.resumen p{margin:0;font-family:var(--serif);font-size:20px;line-height:1.15}
.resumen small{display:block;font-family:var(--sans);font-size:12px;color:#C2DC80;letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:4px}
/* grupos */
.grupos{display:flex;flex-direction:column;gap:10px}
.g{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.g-top h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;color:var(--title)}
.g-top span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.g-top span.ok{color:var(--orquidea);font-weight:700}
.dots{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--c);background:transparent;cursor:pointer;padding:0;position:relative;transition:transform .15s}
.dot.on{background:var(--c)}
.dot.on::after{content:"";position:absolute;left:13px;top:8px;width:9px;height:16px;border:solid var(--k);border-width:0 3px 3px 0;transform:rotate(45deg)}
.dot.half{border-radius:40px 0 0 40px;width:20px}
.dot.half.on::after{left:5px;top:10px;width:6px;height:12px;border-width:0 2.5px 2.5px 0}
.dot:active{transform:scale(.9)}
.ejm{font-size:12px;color:var(--muted)}
/* comidas */
.comidas{display:flex;flex-direction:column}
.cm{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cm:last-child{border-bottom:0}
.cm .h{font-family:var(--serif);font-size:19px;color:var(--title);font-variant-numeric:tabular-nums}
.cm h4{margin:0 0 4px;font-size:14px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--c);color:var(--k)}
.caja{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
/* minuta */
.semsel{display:flex;gap:6px;flex-wrap:wrap}
.semsel button,.dsel button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;cursor:pointer}
.semsel button{padding:8px 14px;font-size:13px}
.semsel button.actual{border-color:var(--orquidea);color:var(--orquidea)}
.semsel button[aria-pressed="true"],.dsel button[aria-pressed="true"]{background:#214D31;border-color:#214D31;color:#fff}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dsel button{padding:9px 0;font-size:12px;border-radius:12px}
.dsel button.hoy{border-color:var(--orquidea);color:var(--orquidea)}
.dsel button.hoy[aria-pressed="true"]{color:#fff}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.mc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mc-top h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0;color:var(--title)}
.mc-top span{font-family:var(--serif);font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.mc p{margin:0;font-size:14.5px;line-height:1.5}
.comi{align-self:flex-start;font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--orquidea);color:var(--orquidea);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer}
.comi.on{background:var(--orquidea);color:#fff}
.tipm{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:10px 14px;margin:0}
.recetas{display:flex;flex-direction:column;gap:8px}
.rct{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.rct summary{font-family:var(--serif);font-size:20px;color:var(--title);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rct summary::-webkit-details-marker{display:none}
.rct summary small{font-family:var(--sans);font-size:12px;color:var(--muted);white-space:nowrap}
.rct[open] summary{color:var(--orquidea)}
.rct p{margin:8px 0 0;font-size:14.5px;line-height:1.5}
/* semana entreno */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.sd{border-radius:12px;padding:8px 2px;text-align:center;cursor:pointer;border:2px solid transparent;font-family:var(--sans);display:flex;flex-direction:column;gap:2px;align-items:center}
.sd span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.sd b{font-family:var(--serif);font-weight:400;font-size:17px}
.sd.fuerza{background:#214D31;color:#fff}.sd.cardio{background:var(--rosa);color:#214D31}.sd.descanso{background:var(--card);color:var(--muted);border:1px dashed var(--line)}
.sd.sel{outline:3px solid var(--orquidea);outline-offset:2px}
.sd i{width:8px;height:8px;border-radius:50%;background:transparent;border:1.5px solid currentColor}
.sd i.hecho{background:#C2DC80;border-color:#C2DC80}
.dia-h{display:flex;align-items:center;gap:12px}
.letra{width:52px;height:52px;border-radius:50%;background:var(--lima);color:#214D31;font-family:var(--serif);font-style:italic;font-size:30px;display:flex;align-items:center;justify-content:center;flex:none}
.ex{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.ex:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:9px;border:2px solid var(--title);background:transparent;cursor:pointer;position:relative;padding:0}
.chk.on{background:var(--orquidea);border-color:var(--orquidea)}
.chk.on::after{content:"";position:absolute;left:9px;top:4px;width:7px;height:13px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.ex b{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--title);display:block;line-height:1.1}
.ex small{color:var(--muted);font-size:12px;display:block}
.pres{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.pres span{font-size:12px;font-weight:600;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-variant-numeric:tabular-nums}
.pres label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.pres input{width:62px;font:inherit;font-size:13px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.cardio-c{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.cardio-c.m{background:var(--rosa);color:#214D31}.cardio-c.h{background:#214D31;color:#fff}
.cardio-c ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.btn{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:12px 18px;background:var(--orquidea);color:#fff;cursor:pointer}
.btn.hecho{background:var(--lima);color:#214D31}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
/* progreso */
.barras{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px}
.bc{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bc .b{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--lima);min-height:3px}
.bc .b.hoy{background:var(--orquidea)}
.bc span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bc em{font-style:normal;font-size:11px;font-weight:700}
/* guía */
input.buscar{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.al{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.al span:last-child{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.gt{display:flex;align-items:center;gap:8px;margin-top:10px}
.gt b{font-family:var(--serif);font-weight:400;font-size:21px;color:var(--title)}
.gt i{width:12px;height:12px;border-radius:50%;background:var(--c)}
/* carga de código */
.carga{display:flex;flex-direction:column;gap:14px}
.carga textarea{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;width:100%;min-height:130px;border-radius:14px;border:1px solid var(--line);background:var(--field);color:var(--ink);padding:12px}
.err{color:#B23A48;font-size:13px;min-height:1em}
.pasos{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none;counter-reset:p}
.pasos li{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;font-size:14.5px}
.pasos li::before{counter-increment:p;content:counter(p);width:32px;height:32px;border-radius:50%;background:var(--orquidea);color:#fff;font-family:var(--serif);font-size:19px;display:flex;align-items:center;justify-content:center}
.link{background:none;border:0;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
/* pestañas */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--tab);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav button{background:none;border:0;font:inherit;font-size:11px;font-weight:600;color:var(--muted);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button[aria-selected="true"]{color:var(--orquidea)}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--orquidea);outline-offset:2px}
.contacto{font-size:13px;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><div class="marca">Porci<em>ona</em></div><div class="rol">por Romina Valenzuela · nutricionista</div></div>
    <span class="hola" id="hola"></span>
  </header>
  <main id="app"></main>
  <p class="contacto" id="pie">¿Dudas? Escríbeme por WhatsApp · @nutricionista.rominavalenzuela</p>
</div>

<nav role="tablist" id="nav" hidden>
  <button data-t="hoy" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Hoy</button>
  <button data-t="minuta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Minuta</button>
  <button data-t="entreno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2M19 12h2M6 8v8M18 8v8M9 10v4M15 10v4M9 12h6"/></svg>Entreno</button>
  <button data-t="progreso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Mi semana</button>
  <button data-t="guia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5" stroke-linecap="round"/></svg>Porciones</button>
</nav>

<script>
/* ===================== Grupos y guía de porciones (de la guía de Romina) ===================== */
const GRUPOS={
  cereales:{nombre:"Cereales",c:"#C2DC80",k:"#214D31",ej:"½ marraqueta o ¾ taza de arroz cocido"},

const G=s=>s.split("|").map(x=>x.split("~"));
const GUIA={
 cereales:G("Pan marraqueta~½ unidad|Pan hallulla~½ unidad|Pan masa madre~1 rebanada|Pan de molde integral~2 rebanadas|Pan de molde blanco~3 rebanadas|Pan pita~1½ unidad|Pan ciabatta~½ unidad|Pan baguette~⅛ unidad|Pan Hi Low~3 rebanadas|Tortilla S~2 unidades|Tortilla M~1 unidad|Arroz blanco (cocido)~¾ taza|Arroz integral (cocido)~¾ taza|Camote~½ unidad|Papa~1 unidad|Choclo~1 taza|Cous cous~1 taza|Mijo~¾ taza|Pasta blanca (cocida)~¾ taza|Pasta integral (cocida)~¾ taza|Plátano verde~1 unidad|Pastelera~½ taza|Quínoa (cocida)~1 taza|Cabritas~3 tazas|Avena instantánea~½ taza|Granola~½ taza|Granola proteica~½ taza|Cereal En Línea~1 taza|Cereal Vivo~¾ taza|Cereal Chocapic S.A.~1 taza|Cereal Fitness~¾ taza|Muesli~½ taza|Quínoa pop S.A.~½ taza|Galletas de soda~6 unidades|Galletas de arroz~6 unidades|Galletas Salma~6 unidades|Galletas de salvado~6 unidades|Galletas Crackelet~12 unidades|Galletas azucaradas~3 unidades|Barra Soul Bar~1 unidad|Barra Mizos~1 unidad|Barra Quaker~2 unidades|Barra En Línea~2 unidades|Galleta Mizos chocolate~2 paquetes|Bulgur~¼ taza|Mote~¼ taza|Harina de arroz~⅓ taza|Harina de avena~⅓ taza|Harina blanca~⅓ taza|Harina integral~⅓ taza|Harina de quínoa~⅓ taza|Harina de garbanzos~⅓ taza|Polenta~⅓ taza|Sémola~⅓ taza|Maicena~2 cucharaditas|Papel de arroz~4 unidades"),

/* ===================== Código del plan ===================== */
function unb64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
async function decodificar(txt){
  const m=String(txt).replace(/\s+/g,"").match(/RV([01])-([A-Za-z0-9_-]+)/);
  if(!m) throw new Error("formato");
  let bytes=unb64(m[2]);
  if(m[1]==="1"){
    if(!window.DecompressionStream) throw new Error("navegador");
    const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    bytes=new Uint8Array(await new Response(ds).arrayBuffer());
  }
  const o=JSON.parse(new TextDecoder().decode(bytes));
  if(!o||!o.p||!o.d) throw new Error("formato");
  return o;
}

async function abrirPlan(clave){
  const C=PLAN_CIFRADO, enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(clave.trim().toLowerCase()),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(C.s),iterations:C.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);

  return JSON.parse(new TextDecoder().decode(plano));
}

const OFF={cereales:0,proteinas:3,frutas:5,verduras:1,lacteos:2,grasas:4};
function ctx(nombre){const n=nombre.toLowerCase();if(n.includes("desayuno"))return"des";if(n.includes("almuerzo"))return"alm";if(n.includes("cena")||n.includes("once"))return"cen";return"col"}
function cant(it,n){let v=it[0]*n;let t=it[3]?String(Math.max(1,Math.round(v))):fr(v);return `${t} ${v>1?it[2]:it[1]}`}
function plato(dia,j,comida,p){
  const L=ALI[ctx(comida)], partes=[];
  ORDEN.forEach((g,gi)=>{const n=+p[g]||0;if(!n)return;const lst=L[g]||ALI.alm[g];
    const L2=lst.length, gcd=(a,b)=>b?gcd(b,a%b):a, step=[5,7,3,1].find(x=>gcd(x,L2)===1);
    const base=(dia*step+j*2+OFF[g]+gi)%L2;
    if((g==="verduras"||g==="frutas")&&n>1){let resto=n,k=0;while(resto>0){const u=Math.min(1,resto);partes.push(cant(lst[(base+k)%lst.length],u));resto-=u;k++}}
    else partes.push(cant(lst[base],n));});
  if(!partes.length) return "Libre: agua o infusión.";
  let t=partes.length>1?partes.slice(0,-1).join(", ")+" y "+partes.at(-1):partes[0];
  t=t.charAt(0).toUpperCase()+t.slice(1);
  if(+p.verduras&&ctx(comida)!=="col") t+=". Verduras de consumo libre a gusto";
  return t+".";
}

  else if(t.dataset.sem){semMin=+t.dataset.sem;render();}
  else if(t.dataset.dm){diaMin=+t.dataset.dm;render();}
  else if(t.dataset.comi){const k=fk(new Date()),i=+t.dataset.comi;S.comi=S.comi||{};S.comi[k]=S.comi[k]||{};S.dias[k]=S.dias[k]||{};
    const on=!S.comi[k][i], p=PLAN.d[i][2];
    ORDEN.forEach(g=>{if(+p[g]){const v=(S.dias[k][g]||0)+(on?+p[g]:-p[g]);S.dias[k][g]=Math.max(0,Math.min(Math.ceil(req(g)),Math.ceil(v)))}});
    S.comi[k][i]=on;guardar();render();}
  else if(t.dataset.ex){const k=t.dataset.k+"-ex";S.entreno[k]=S.entreno[k]||[];S.entreno[k][+t.dataset.ex]=!S.entreno[k][+t.dataset.ex];guardar();render();}
  else if(t.id==="fin"){S.entreno[t.dataset.k]=!S.entreno[t.dataset.k];guardar();render();}
});
app.addEventListener("input",e=>{
  if(e.target.id==="buscar"){busq=e.target.value;document.getElementById("lista").innerHTML=listaGuia();}
  else if(e.target.dataset.p){S.pesos[e.target.dataset.p]=e.target.value;guardar();}
});
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;render();window.scrollTo(0,0);});
app.addEventListener("submit",e=>{if(e.target.id!=="fClave")return;e.preventDefault();intentarClave(document.getElementById("clave").value,false)});
(async()=>{
  if(PLAN_CIFRADO&&!PLAN){let c=null;try{c=localStorage.getItem(NS+"clave")}catch(e){}
    if(c&&await intentarClave(c,true))return;}
  render();
})();
</script>
